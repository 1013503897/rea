name: Experimental Windows readonly fixture mutation oracle
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [without-normal-fix, fixed]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build:cached
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.variant == 'fixed' && '38662148662' || '38660840144' }}
          name: windows-creation-owner-native-fixed
          path: native/windows/build/
      - name: Verify permanent fixture detects missing NORMAL fallback
        shell: bash
        env:
          EXPECTED_VARIANT: ${{ matrix.variant }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          const result=spawnSync(process.execPath,['scripts/verify-windows-native.mjs','.'],{encoding:'utf8',timeout:180000});
          if(result.error)throw result.error;
          process.stdout.write(result.stdout);
          process.stderr.write(result.stderr);
          if(process.env.EXPECTED_VARIANT==='fixed'){
            assert.equal(result.status,0);
            const observed=JSON.parse(result.stdout.trim());
            assert.equal(observed.ok,true);
            assert.equal(observed.controls.readonlyFileWithoutArchiveAttributeRemoved,true);
          }else{
            assert.notEqual(result.status,0);
            assert.match(result.stderr,/Delete owned object by handle failed/);
            assert.match(result.stderr,/Win32 5/);
          }
          console.log(JSON.stringify({ok:true,variant:process.env.EXPECTED_VARIANT,permanentVerifierStatus:result.status,baselineMissingNormalDetected:process.env.EXPECTED_VARIANT!=='fixed'}));
          JS
