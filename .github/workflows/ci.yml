name: Experimental Windows MCP startup diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-mcp-startup:
    name: Windows MCP startup diagnostic (#1685)
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      HUSKY: "0"
      REA_MCP_STARTUP_QUALIFIED_SHA: fffb0741936067530d1ce9777461cd53e87398c2
      REA_MCP_STARTUP_INSTALL_PREFIX: .cache/rea-1685-installed
      REA_MCP_STARTUP_OUTPUT: .cache/mcp-startup-probe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Verify pinned runtime and report runner identity
        shell: pwsh
        run: |
          if ((node --version) -ne 'v24.18.0') { throw 'Expected pinned Node v24.18.0' }
          node --version
          $npmVersion = npm --version
          Write-Output $npmVersion
          "REA_MCP_STARTUP_NPM_VERSION=$npmVersion" >> $env:GITHUB_ENV
          node -e "console.log(JSON.stringify({platform:process.platform,architecture:process.arch,release:require('node:os').release(),cpus:require('node:os').cpus().length}))"
      - name: Install locked source dependencies
        run: npm ci
      - name: Restore the exact qualified Windows native artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-controls
          repository: morluto/rea
          run-id: 38629313022
          github-token: ${{ github.token }}
          path: native/windows/build/
      - name: Restore the exact qualified package and manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-package
          repository: morluto/rea
          run-id: 38629313022
          github-token: ${{ github.token }}
          path: .cache/verified-package/
      - name: Verify exact package and native artifact identities
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs');const c=require('node:crypto');const m=JSON.parse(fs.readFileSync('.cache/verified-package/manifest.json','utf8'));const d=c.createHash('sha256').update(fs.readFileSync('.cache/verified-package/package.tgz')).digest('hex');if(m.sourceSha!==process.env.REA_MCP_STARTUP_QUALIFIED_SHA||m.runId!==38629313022||m.nodeVersion!=='v24.18.0'||d!==m.sha256)throw Error('Qualified package identity mismatch');console.log(JSON.stringify({sourceSha:m.sourceSha,runId:m.runId,version:m.packageVersion,nodeVersion:m.nodeVersion,packageSha256:d}));"
          npm run verify:windows-native:artifact
      - name: Build the checked-out runtime from source
        run: npm run build:cached
      - name: Measure first and subsequent source-tree MCP processes
        continue-on-error: true
        run: node scripts/experiments/mcp-startup-diagnostic.mjs source-tree
      - name: Freshly install the exact qualified package archive
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path $env:REA_MCP_STARTUP_INSTALL_PREFIX | Out-Null
          npm install --prefix $env:REA_MCP_STARTUP_INSTALL_PREFIX --ignore-scripts --no-audit --no-fund .cache/verified-package/package.tgz
      - name: Measure first and subsequent installed-package MCP processes
        if: always()
        continue-on-error: true
        run: node scripts/experiments/mcp-startup-diagnostic.mjs installed-package
      - name: Record installed package dependency resolution after measurement
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          npm ls --prefix $env:REA_MCP_STARTUP_INSTALL_PREFIX --all --json |
            Out-File -Encoding utf8NoBOM (Join-Path $env:REA_MCP_STARTUP_OUTPUT 'installed-dependencies.json')
      - name: Require complete diagnostic samples
        if: always()
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:REA_MCP_STARTUP_OUTPUT 'mcp-startup-report.json'
          if (-not (Test-Path $reportPath)) { throw 'Diagnostic report was not written' }
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          $entries = @($report.entries)
          if ($entries.Count -ne 2) { throw "Expected two entrypoint groups; observed $($entries.Count)" }
          foreach ($entry in $entries) {
            if (@($entry.samples).Count -ne 5) { throw "Expected five samples for $($entry.name)" }
            foreach ($sample in $entry.samples) {
              if (-not $sample.completed -or $null -eq $sample.serverExitMetrics -or $null -ne $sample.error) {
                throw "Incomplete MCP/shutdown metrics for $($entry.name) sample $($sample.iteration): $($sample.error) $($sample.serverExitMetricsError)"
              }
            }
          }
          Write-Output "All 10 fresh MCP server processes initialized, listed tools twice, closed, and wrote per-process metrics. No latency threshold was applied."
      - name: Upload full MCP exchanges and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: experimental-windows-mcp-startup-${{ github.run_id }}
          path: .cache/mcp-startup-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
