name: CI
run-name: "Temporary issue 3543 diagnostic; never merge this branch"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-3543-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose-macos:
    name: Diagnose original macOS CLI deadline
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - name: Record toolchain and create owned diagnostic directories
        run: |
          node --version
          npm --version
          mkdir -p diagnostics/full diagnostics/isolated
          git rev-parse HEAD
      - name: Verify Apple artifact formats and metadata
        env:
          REA_ARTIFACT_NODE_COMPILE_CACHE: ${{ runner.temp }}/rea-artifact-node-cache
        run: |
          npm run verify:keyed-archive
          npm run verify:asset-catalog
          npm run verify:macos-bundle
          npm run verify:legacy-simulator
          npm run verify:apple-dispatch
          npm run verify:interface-builder
      - name: Original complete Apple boundary family, unchanged deadlines
        env:
          REA_CI_PROCESS_DIAGNOSTICS: ${{ github.workspace }}/diagnostics/full
        run: >-
          npm run test:focused --
          tests/boundary/filesystem/installScript.test.ts
          tests/boundary/filesystem/nibNativeHierarchy.test.ts
          tests/boundary/filesystem/interfaceBuilderBundle.test.ts
          tests/boundary/cli/nativePlistCli.test.ts
          tests/boundary/cli/nativePlistPrototypeKeyCli.test.ts
          tests/boundary/cli/nativePlistSelectionFailureCli.test.ts
          tests/boundary/cli/nativeDemangleCli.test.ts
          tests/boundary/mcp/nativeDemangleMcp.test.ts
          tests/boundary/providers/native/nativeSignatureTargetBinding.test.ts
          tests/boundary/cli/nativeSignatureCli.test.ts
          tests/boundary/mcp/nativeSignatureTargetBindingMcp.test.ts
          src/process/capture/FilesystemSnapshot.test.ts
          tests/process-global/filesystemSnapshotFallbackCancellation.test.ts
          tests/boundary/process/darwinProcessRunTokenReader.test.ts
          tests/boundary/process/directAnalysisSignals.test.ts
          tests/boundary/process/processCaptureLifecycle.test.ts
          tests/boundary/process/processCli.test.ts
          tests/boundary/mcp/sessionMcp.test.ts

      - name: Isolated demangle family to distinguish cross-family load
        if: ${{ !cancelled() }}
        env:
          REA_CI_PROCESS_DIAGNOSTICS: ${{ github.workspace }}/diagnostics/isolated
        run: npm run test:focused -- tests/boundary/cli/nativeDemangleCli.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: macos-deadline-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
